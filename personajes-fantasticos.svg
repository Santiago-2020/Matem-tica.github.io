<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title description">
    <title id="title">Poroto, Pinchuskin y Hada, un equipo de amigos</title>
    <desc id="description">Ilustración fantástica de un poroto verde, un hámster redondito y un hada de vestido pastel, juntos en un jardín mágico.</desc>
    <defs>
        <linearGradient id="sky" x1="70" y1="0" x2="800" y2="560" gradientUnits="userSpaceOnUse">
            <stop stop-color="#f8e9ff"/>
            <stop offset=".48" stop-color="#d9eaff"/>
            <stop offset="1" stop-color="#c5f1e7"/>
        </linearGradient>
        <linearGradient id="bean" x1="178" y1="196" x2="297" y2="411" gradientUnits="userSpaceOnUse">
            <stop stop-color="#c8f49a"/>
            <stop offset=".48" stop-color="#85d477"/>
            <stop offset="1" stop-color="#43a977"/>
        </linearGradient>
        <linearGradient id="beanLight" x1="190" y1="210" x2="230" y2="280" gradientUnits="userSpaceOnUse">
            <stop stop-color="#efffd1" stop-opacity=".85"/>
            <stop offset="1" stop-color="#efffd1" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="hamsterFur" cx="0" cy="0" r="1" gradientTransform="matrix(0 154 -156 0 430 245)" gradientUnits="userSpaceOnUse">
            <stop stop-color="#ffe2ae"/>
            <stop offset=".68" stop-color="#eebc7a"/>
            <stop offset="1" stop-color="#c98457"/>
        </radialGradient>
        <linearGradient id="hamsterBelly" x1="382" y1="290" x2="480" y2="405" gradientUnits="userSpaceOnUse">
            <stop stop-color="#fff8e9"/>
            <stop offset="1" stop-color="#f4d9b8"/>
        </linearGradient>
        <linearGradient id="fairyDress" x1="660" y1="282" x2="714" y2="424" gradientUnits="userSpaceOnUse">
            <stop stop-color="#f5c5ff"/>
            <stop offset=".58" stop-color="#c5a4ff"/>
            <stop offset="1" stop-color="#8d7ce2"/>
        </linearGradient>
        <linearGradient id="wing" x1="630" y1="172" x2="735" y2="303" gradientUnits="userSpaceOnUse">
            <stop stop-color="#fff" stop-opacity=".92"/>
            <stop offset=".55" stop-color="#a8f3f1" stop-opacity=".74"/>
            <stop offset="1" stop-color="#c6a9ff" stop-opacity=".6"/>
        </linearGradient>
        <linearGradient id="hair" x1="657" y1="154" x2="720" y2="239" gradientUnits="userSpaceOnUse">
            <stop stop-color="#a97853"/>
            <stop offset="1" stop-color="#714b51"/>
        </linearGradient>
        <radialGradient id="orb" cx="0" cy="0" r="1" gradientTransform="matrix(0 16 -16 0 0 0)" gradientUnits="userSpaceOnUse">
            <stop stop-color="#fff"/>
            <stop offset=".55" stop-color="#ffe994"/>
            <stop offset="1" stop-color="#ffc967" stop-opacity="0"/>
        </radialGradient>
        <filter id="shadow" x="-30%" y="-20%" width="160%" height="170%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
            <feOffset dy="9"/>
            <feComponentTransfer><feFuncA type="linear" slope=".2"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="8"/>
        </filter>
    </defs>

    <rect width="900" height="560" rx="38" fill="url(#sky)"/>
    <circle cx="727" cy="102" r="57" fill="#fff" opacity=".24" filter="url(#glow)"/>
    <circle cx="727" cy="102" r="31" fill="#fff6d8" opacity=".8"/>
    <path d="M0 340c100-43 189-26 287 3 98 29 177 10 272-21 100-32 220-29 341 7v231H0Z" fill="#b8e4d7" opacity=".62"/>
    <path d="M0 397c122-51 235-17 349 14 114 31 208 13 315-15 76-20 157-20 236-2v166H0Z" fill="#a5d9bb" opacity=".72"/>
    <path d="M0 460q160-45 311 1 152 47 303 0 140-43 286-3v102H0Z" fill="#82c7a5" opacity=".76"/>

    <g fill="#fff" opacity=".72">
        <path d="m113 104 5 14 14 5-14 5-5 14-5-14-14-5 14-5Z"/>
        <path d="m350 91 4 11 11 4-11 4-4 11-4-11-11-4 11-4Z"/>
        <path d="m557 117 4 10 10 4-10 4-4 10-4-10-10-4 10-4Z"/>
        <path d="m818 235 5 13 13 5-13 5-5 13-5-13-13-5 13-5Z"/>
    </g>
    <g fill="#ffdf84" opacity=".9">
        <circle cx="86" cy="250" r="4"/><circle cx="335" cy="164" r="4"/>
        <circle cx="592" cy="191" r="3"/><circle cx="788" cy="316" r="4"/>
        <circle cx="131" cy="362" r="3"/><circle cx="754" cy="408" r="3"/>
    </g>

    <ellipse cx="450" cy="466" rx="324" ry="27" fill="#538e7b" opacity=".18"/>

    <!-- Poroto: un frijol verde redondo con carita, brazos y patitas. -->
    <g filter="url(#shadow)">
        <path d="M197 414q-13 15-12 30 1 10 14 8l17-4 4-31m64-3 7 28q2 12 15 9 11-3 8-14l-11-31" fill="#559f67" stroke="#356b59" stroke-width="5" stroke-linecap="round"/>
        <path d="M188 330q-27 4-35 24-5 13 9 16 17 2 37-19m105-20q28 4 35 24 5 13-9 16-17 2-37-19" fill="none" stroke="#559f67" stroke-width="11" stroke-linecap="round"/>
        <path d="M246 180c61-7 100 37 97 103-2 68-34 124-96 132-58 7-103-36-102-102 1-63 39-126 101-133Z" fill="url(#bean)" stroke="#428c65" stroke-width="6"/>
        <ellipse cx="218" cy="248" rx="28" ry="55" transform="rotate(25 218 248)" fill="url(#beanLight)"/>
        <path d="M209 198q20-16 45-16m-56 34 8-9" fill="none" stroke="#f0ffd7" stroke-width="8" stroke-linecap="round" opacity=".8"/>
        <ellipse cx="225" cy="299" rx="7" ry="10" fill="#29475a"/><ellipse cx="279" cy="299" rx="7" ry="10" fill="#29475a"/>
        <ellipse cx="227" cy="296" rx="2.5" ry="3.5" fill="#fff"/><ellipse cx="281" cy="296" rx="2.5" ry="3.5" fill="#fff"/>
        <ellipse cx="204" cy="321" rx="10" ry="6" fill="#f28fa0" opacity=".76"/><ellipse cx="301" cy="321" rx="10" ry="6" fill="#f28fa0" opacity=".76"/>
        <path d="M238 326q15 18 30 0" fill="none" stroke="#68485a" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Pinchuskin: hámster redondo, suave y de mejillas grandes. -->
    <g filter="url(#shadow)">
        <path d="M394 414q-15 18-12 31 3 10 16 5l19-14m42-20 18 20q10 9 18 0 8-9-3-18l-20-20" fill="#cf9564" stroke="#9c674b" stroke-width="5" stroke-linecap="round"/>
        <ellipse cx="383" cy="232" rx="30" ry="34" fill="#c98455" stroke="#9c674b" stroke-width="6"/>
        <ellipse cx="479" cy="232" rx="30" ry="34" fill="#c98455" stroke="#9c674b" stroke-width="6"/>
        <ellipse cx="383" cy="234" rx="16" ry="19" fill="#f4b4a9"/><ellipse cx="479" cy="234" rx="16" ry="19" fill="#f4b4a9"/>
        <ellipse cx="431" cy="329" rx="82" ry="91" fill="url(#hamsterFur)" stroke="#9c674b" stroke-width="6"/>
        <path d="M369 304q18-37 47-31m34-1q31-3 46 32" fill="none" stroke="#fff0d4" stroke-width="15" stroke-linecap="round" opacity=".78"/>
        <ellipse cx="431" cy="369" rx="47" ry="43" fill="url(#hamsterBelly)"/>
        <ellipse cx="397" cy="320" rx="8" ry="11" fill="#263849"/><ellipse cx="464" cy="320" rx="8" ry="11" fill="#263849"/>
        <ellipse cx="399" cy="316" rx="3" ry="4" fill="#fff"/><ellipse cx="466" cy="316" rx="3" ry="4" fill="#fff"/>
        <ellipse cx="431" cy="348" rx="8" ry="6" fill="#aa6470"/>
        <path d="M419 361q12 12 24 0" fill="none" stroke="#80515a" stroke-width="4" stroke-linecap="round"/>
        <ellipse cx="376" cy="350" rx="13" ry="8" fill="#ed9993" opacity=".72"/><ellipse cx="486" cy="350" rx="13" ry="8" fill="#ed9993" opacity=".72"/>
        <path d="M363 367q-22 0-28 9m31 1q-23 4-28 14m160-24q22 0 28 9m-31 1q23 4 28 14" fill="none" stroke="#a97858" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Hada: vestido pastel, alas transparentes y varita brillante. -->
    <g filter="url(#shadow)">
        <path d="M663 256c-48-82-78-47-51 5-37 39-8 71 38 41m64-46c48-82 78-47 51 5 37 39 8 71-38 41" fill="url(#wing)" stroke="#89c8dd" stroke-width="4"/>
        <path d="M650 250q33 7 36 42m51-42q-33 7-36 42" fill="none" stroke="#fff" stroke-width="4" opacity=".78"/>
        <path d="m694 306-39 120q39 28 78 0l-39-120Z" fill="url(#fairyDress)" stroke="#8274c9" stroke-width="5" stroke-linejoin="round"/>
        <path d="m663 368 31 13 31-13m-53 24 22 9 22-9" fill="none" stroke="#fff0ff" stroke-width="5" opacity=".85"/>
        <path d="M680 420q-15 17-28 8m56-8q15 17 28 8" fill="none" stroke="#ffd9bd" stroke-width="10" stroke-linecap="round"/>
        <path d="M655 327q-19 18-23 43m101-43q19 18 23 43" fill="none" stroke="#ffd9bd" stroke-width="9" stroke-linecap="round"/>
        <circle cx="694" cy="239" r="43" fill="#ffd9c6" stroke="#9b6872" stroke-width="5"/>
        <path d="M651 241q-2-53 44-53 44 0 44 54l-14-17-12 7-16-13-15 13-17-9Z" fill="url(#hair)" stroke="#684853" stroke-width="5" stroke-linejoin="round"/>
        <path d="M665 205q14-18 29-14m14 1q17 3 22 17" fill="none" stroke="#d7a47d" stroke-width="5" stroke-linecap="round"/>
        <ellipse cx="679" cy="244" rx="5" ry="7" fill="#3c465d"/><ellipse cx="709" cy="244" rx="5" ry="7" fill="#3c465d"/>
        <ellipse cx="680" cy="242" rx="1.7" ry="2.4" fill="#fff"/><ellipse cx="710" cy="242" rx="1.7" ry="2.4" fill="#fff"/>
        <ellipse cx="664" cy="258" rx="8" ry="5" fill="#f19aa8" opacity=".75"/><ellipse cx="724" cy="258" rx="8" ry="5" fill="#f19aa8" opacity=".75"/>
        <path d="M686 264q8 9 16 0" fill="none" stroke="#a35e71" stroke-width="4" stroke-linecap="round"/>
        <path d="m746 319 36-67" stroke="#8c6b51" stroke-width="5" stroke-linecap="round"/>
        <path d="m781 237 5 13 13 5-13 5-5 13-5-13-13-5 13-5Z" fill="#fff1a6" stroke="#e4b85c" stroke-width="3"/>
        <circle cx="781" cy="250" r="28" fill="#ffe89a" opacity=".4" filter="url(#glow)"/>
    </g>

    <g fill="url(#orb)">
        <circle cx="128" cy="188" r="18"/><circle cx="334" cy="253" r="13"/>
        <circle cx="553" cy="210" r="16"/><circle cx="810" cy="177" r="15"/>
        <circle cx="574" cy="380" r="12"/><circle cx="116" cy="402" r="12"/>
    </g>
    <g fill="#fff8d8">
        <path d="m344 211 3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/>
        <path d="m572 294 3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/>
        <path d="m812 352 3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/>
    </g>
</svg>
